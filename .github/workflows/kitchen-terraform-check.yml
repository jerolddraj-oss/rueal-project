name: Kitchen Terraform Structure Check

on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'environments/**'
      - 'docs/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'modules/**'
      - 'environments/**'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive modules environments

      - name: Validate dev
        working-directory: environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate prod
        working-directory: environments/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
